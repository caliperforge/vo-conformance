name: daily

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -m live
      - if: ${{ !cancelled() }}
        run: |
          [ -f results/matrix.jsonl ] || exit 0
          day=$(date -u +%F)
          cat results/matrix.jsonl >> "results/$day.jsonl"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/$day.jsonl"
          git commit -m "results: $day"
          git push
